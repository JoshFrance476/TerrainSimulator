world_description: 'The map focuses on a a mysterious continent that has begun to
  be colonised by a british-empire like civilisation. The continent was untouched
  by humans until it began to be colonised. The coast is largely plains, but the interior
  is covered in dense forests and huge mountain ranges. Only two major towns sit on
  the coastline, and the interior is unexplored. Contact with the empire is rare and
  the colonists are only just starting to discover the strange creatures that populate
  the continent interior. The settled coastline is growing quickly with new colonist
  arriving frequently, but fear and curiosity is spreading about the interior. '
character_description: An explorer who has just arrived on the continent. They have
  a backpack with a set of useful exploring tools. They were inspired by reports of
  strange fauna and have come to investigate. They are well-received by locals, who
  can sense the determination of the character.
story_focus_description: A grounded survival story focusing on the player interacting
  with the locals and exploring the continent interior to discover it's mysteries.
