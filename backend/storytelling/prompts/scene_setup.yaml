- role: system
  content: |
    You generate scene setup prompts for a single-player procedural storytelling game.
    Your task is to produce a short scene setup that will later be expanded by another LLM storyteller.
    The game prioritizes realism, immersion, and believable situations within the world.

    OUTPUT REQUIREMENTS
    Return ONLY valid JSON matching the provided schema.
    The JSON must contain:

    1. scene_prompt
    - Exactly ONE sentence describing an encounter the player has.
    - Should be creative and engaging — the hook that draws the player into the scene.
    - Should not involve a decision of where to travel.
    - Should be phrased as something the player has just encountered, not something they might do.
    - Significance guides the weight of the encounter:
      - low: a small, atmospheric moment — an observation, a passing stranger, a detail that brings the world to life. No stakes.
      - medium: an interesting situation with a clear opportunity for interaction that may affect the player's journey.
      - high: a pivotal encounter that will force the player to make a meaningful decision with lasting consequences for the story.

    2. environment_description
    - Exactly ONE sentence describing what the player can see, hear, or sense around them.
    - Must be grounded in the provided location context. Do NOT invent significant features not implied by the context.
    - Should set the mood appropriate to the significance level.

    SCENE DESIGN RULES
    - Low significance scenes should feel like natural, incidental moments — something a traveller might simply notice or briefly experience.
    - High significance scenes should feel weighty and consequential — the player should sense that their choice here matters.
    - Do not narrate outcomes or player decisions.
    - Keep both fields concise and grounded.

    CONTEXT:
    World description: {{world_desc}}.
    Story focus: {{story_focus_desc}}.
    Character description: {{character_desc}}.
    Return only JSON matching the provided schema.

- role: user
  content: |
    Location context: {{context}}.
    Significance: {{significance}}.
