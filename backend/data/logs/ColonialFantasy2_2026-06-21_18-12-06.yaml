# --- INTERACTION REQUEST ---
- role: system
  content: |
    You are the storyteller in an arcade-style story game set within a procedurally-generated world.
    Your task is to turn the scene guide you are given into a concise narrative to present to the player.
    
    CONTEXT
    You will receive:
    - scene_guide: A general guide for the next step in the scene.
    - scene_history: A chronological account of what has already occured in the scene.
    
    OUTPUT RULES
    - Write the scene guide into second-person narrative prose. 150 words max.
    - The user is roleplaying as the character. Present the scene to their character.
    - Ensure not to skip details from the story suggestion and include details from precise_location and environment_description that will immerse the player in the scene.
    - Don't repeat what has already been described in the scene_history.
    - Provide one action per outcome suggestion that could plausibly lead to it. Actions can be 
      physical, observational, conversational, or instinctive — whatever fits the scene naturally. 
    - Actions must accurately describe the character's action that would lead to the outcome suggestion.
    - Ensure there is one action per outcome suggestion.
    - If the outcome suggestion ends the scene, set exit_flag: True for the action.
    - Each action must be under 15 words.
    
    WRITING STYLE
    - Prose must be plain and observational. Avoid cinematic staging clichés 
      (e.g. "leans in", "voice low", "eyes scanning", "pauses meaningfully").
    - Describe what literally happens, not how a film would frame it.
    - NPC speech should sound like an ordinary person, not a dramatic character.
    - Favour concrete nouns over atmospheric adjectives.
    
    
    World description: The map focuses on a a mysterious continent that has begun to be colonised by a british-empire like civilisation. The continent was untouched by humans until it began to be colonised. The coast is largely plains, but the interior is covered in dense forests and huge mountain ranges. Only two major towns sit on the coastline, and the interior is unexplored. Contact with the empire is rare and the colonists are only just starting to discover the strange creatures that populate the continent interior. The settled coastline is growing quickly with new colonist arriving frequently, but fear and curiosity is spreading about the interior. 
    Story focus: A grounded survival story focusing on the player interacting with the locals and exploring the continent interior to discover it's mysteries.
- role: user
  content:
    guide:
      environment_description: The regional capital town sits at the mouth of the Res
        River, where wooden docks stretch into the water alongside stacked cargo and moored
        boats, with the dense forest pressing close to the south and city walls enclosing
        the settlement.
      precise_location: The player stands on a weathered wooden dock platform near the
        edge of the town, ropes tied to iron cleats creaking as small waves lap beneath
        the planks, with a rowboat bobbing nearby and a customs officer approaching from
        the west.
      story_suggestion: A customs officer questions the player's intent in the capital,
        offering information about expeditions into the interior in exchange for help
        retrieving a lost surveyor's journal from the riverbank to the east.
      outcome_suggestions:
      - Agree to retrieve the journal from the riverbank reeds, gaining a map to an uncharted
        trail into the forest (ends scene).
      - Refuse the request and head west into town to seek rumors of the interior independently
        (ends scene).
      - Attempt to bribe the officer for information, risking being reported to the garrison.
      - Notice something unnatural in the river current downstream and investigate, spotting
        strange tracks leading into the forest.
    previous_interactions: []

# --- INTERACTION RESPONSE ---
- interaction_description: |
    You stand on a weathered dock at the edge of the capital, the Res River lapping beneath the planks. A customs officer in a faded blue coat approaches, his boots heavy on the wood. Behind him, cargo crates are stacked beneath tarps, and a rowboat bobs in the slack water, tethered to a splintered post. To the south, the forest looms, dense and still, pressing against the town’s walls. The officer stops a few paces away and says, “No one comes here without reason. What’s your business?”
    
    He eyes you as he speaks, one hand resting on the journal-sized gap in his coat pocket. Downstream, the river’s current swirls oddly around a half-submerged log.
  actions:
  - action: Agree to retrieve the journal from the reeds along the riverbank to the
      east.
    exit_flag: true
  - action: Refuse and walk west into town to question dockworkers about the interior.
    exit_flag: true
  - action: Offer the officer coins for information instead of doing the task.
    exit_flag: false
  - action: Step to the dock’s edge and look closely at the swirling water downstream.
    exit_flag: false
