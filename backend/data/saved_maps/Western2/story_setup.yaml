world_description: Arizona Territory, 1882. A vast and unforgiving frontier of red
  rock canyons, dust-choked trails, and sun-bleached settlements clinging to survival.
  The law is thin here.
character_description: A drifter with a clouded past who has rolled into the area
  with empty pockets and no particular plan. You are handy with a gun and handier
  with a lie.
story_focus_description: A realistic presentation of life on the frontier.
